<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acuity Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#0b1b33;--mut:#55627a;--ac:#0d9488;--ac2:#ccfbf1;--bd:#e0e7f1;--sh:0 8px 30px rgba(11,27,51,.08);--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1a;--card:#101a2e;--tx:#eef3fb;--mut:#9fb0c8;--ac:#2dd4bf;--ac2:#0f3a38;--bd:#22304a;--sh:none;--bt:#04201c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070d1a;--card:#101a2e;--tx:#eef3fb;--mut:#9fb0c8;--ac:#2dd4bf;--ac2:#0f3a38;--bd:#22304a;--sh:none;--bt:#04201c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif;padding-bottom:84px}
.w{max-width:760px;margin:0 auto;padding:0 18px}
.hero{background:radial-gradient(600px 300px at 85% -10%,#14b8a6aa,transparent),radial-gradient(500px 300px at 0% 110%,#f59e0b55,transparent),#06132b;color:#fff;padding:56px 0 60px;border-radius:0 0 32px 32px}
.pill{display:inline-flex;gap:8px;align-items:center;background:#ffffff1a;border:1px solid #ffffff33;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:p 1.6s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #34d39988}100%{box-shadow:0 0 0 10px #34d39900}}
h1{font:800 clamp(36px,9vw,56px)/1.06 Fraunces,Georgia,serif;margin:18px 0 12px}
h1 em{font-style:normal;background:linear-gradient(90deg,#5eead4,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c6d4ea;font-size:17px;max-width:520px;margin:0 0 24px}
h2{font:800 26px/1.15 Fraunces,Georgia,serif;margin:34px 0 8px}
.sub,p{color:var(--mut);margin:0 0 12px}
.btn{display:inline-block;background:linear-gradient(135deg,#2dd4bf,#14b8a6);color:#04201c;border:0;border-radius:14px;padding:14px 24px;font:700 16px Inter,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.w100{width:100%}.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.hero .btn.ghost{color:#fff;border-color:#ffffff66;margin-left:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:12px;display:block;color:inherit;text-decoration:none;animation:up .35s both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 4px;font:700 18px Fraunces,Georgia,serif}
.card p{margin:0 0 8px;font-size:15px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cats .card{margin:0;text-align:left}
.cats .ic{font-size:30px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;margin-right:6px;background:var(--ac2);color:var(--ac)}
.tag.soon{background:var(--bd);color:var(--mut)}
.back{display:inline-block;margin:22px 0 0;color:var(--ac);font-weight:600;text-decoration:none}
ul.o{padding-left:20px;margin:0 0 12px;color:var(--mut)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.meta div{background:var(--ac2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut)}
.meta b{display:block;color:var(--tx);font-size:15px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:16px Inter,sans-serif}
.price{font:800 34px Fraunces,serif;color:var(--ac);margin:4px 0}
.prog{display:flex;gap:6px;margin:16px 0}.prog i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.prog i.on{background:var(--ac)}
.note{font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav a{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mut);text-decoration:none}
nav a span{display:block;font-size:20px}nav a.on{color:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<nav><a href="#home" id="n-home"><span>🏠</span>Home</a><a href="#courses" id="n-courses"><span>📚</span>Courses</a><a href="#about" id="n-about"><span>ℹ️</span>About</a></nav>
<script>
/* ===== EDIT THESE ===== */
var WA="249967972912";
var BANK="Bankak · Account number: 3968507";
var OPEN={history:{ // only courses listed here are open for registration
  group:"20,000 SDG",solo:"30,000 SDG",
  dur:"3 sessions · 90 min each",size:"Group: max 8 students",
  obj:["Take a complete, well-structured history with confidence","Explore pain and red flags, and never forget ICE","Use clear phrases patients understand","Perform under OSCE conditions and know what examiners want"],
ses:[["Session 1: Core of History Taking","Why history matters, the structure (Intro, HPC, PMH, DH, FH, SH, ICE), opening the consultation, SOCRATES, red flags, ICE, common mistakes and a demo case."],["Session 2: Practice","Live role-play. One student is the doctor, one the patient, the rest observe. Surgical cases with real-time correction and guidance."],["Session 3: OSCE and Feedback","OSCE rules, marking scheme, common mistakes, then timed mock stations with direct feedback on what was good, what was missing and how to improve."]]}};
var CATS=[
{id:"med",n:"Medical Students",ic:"🎓",c:[
 ["history","Clinical History Taking","Master the structure and art of taking a clear, complete patient history."],
 ["exam","Clinical Examination","A systematic approach to examining patients with confidence."],
 ["intro","Introduction to Surgical Practice","First steps into the surgical world: ward, theatre and team."],
 ["common","Common Surgical Conditions","The conditions you will meet most often, and how they present."],
 ["cases","Surgical Clinical Cases","Learn through real-style surgical cases, discussed live."]]},
{id:"ho",n:"House Officers",ic:"🩺",c:[
 ["emerg","Common Surgical Emergencies","Recognise and start managing the emergencies you will be called for."],
 ["trauma","Initial Trauma Assessment and Management","A structured approach to the injured patient."],
 ["ward","Surgical Ward Management","Run your surgical ward day safely and efficiently."],
 ["postop","Postoperative Patient Management","Monitor, recognise problems and act after surgery."],
 ["fluid","Fluid and Electrolyte Management in Surgery","Prescribe fluids and correct electrolytes with confidence."],
 ["proc","Common Surgical Procedures and Practical Skills","Essential procedures every junior doctor should know."]]},
{id:"res",n:"Surgical Residents",ic:"🔬",c:[
 ["fund","Fundamentals of General Surgery","Core principles of general surgery, revisited with depth."],
 ["acute","Approach to Acute Abdomen","A reasoned approach from presentation to decision."],
 ["preop","Preoperative Assessment and Postoperative Care","Optimise patients before surgery and manage them after."],
 ["decide","Surgical Decision-Making","When to operate, when to wait and why."],
 ["invest","Interpretation of Common Surgical Investigations","Read labs and imaging in the surgical context."],
 ["casesr","Case-Based Surgical Discussions","Live discussion of challenging surgical cases."]]},
{id:"oet",n:"OET Introduction",ic:"🗣️",c:[
 ["oet","OET: A Short Introduction","A brief, introductory orientation to the OET. Not a full preparation course.",
  ["What the OET is and who needs it","Exam structure and scoring","The four subtests at a glance","Writing: referral and discharge letters (overview)","Speaking: role-play structure (overview)","Common mistakes and exam strategies","Resources and how to plan your study"]]]}];
/* ====================== */
var app=document.getElementById("app");
function find(id){for(var i=0;i<CATS.length;i++)for(var j=0;j<CATS[i].c.length;j++)if(CATS[i].c[j][0]===id)return{cat:CATS[i],c:CATS[i].c[j]}}
function wa(msg){return"https://wa.me/"+WA+"?text="+encodeURIComponent(msg)}
function status(id){return OPEN[id]?'<span class="tag">Open for registration</span>':'<span class="tag soon">Register your interest</span>'}
function home(){return'<section class="hero"><div class="w"><span class="pill"><span class="dot"></span> LIVE ON ZOOM</span><h1>Train sharper.<br>Think like a <em>clinician.</em></h1><p>Surgical teaching for medical students, house officers and residents. Small groups or one-to-one.</p><a class="btn" href="#courses">Browse courses</a><a class="btn ghost" href="#about">About</a></div></section><div class="w"><h2>Explore by level</h2><div class="cats">'+CATS.map(function(k){return'<a class="card" href="#cat-'+k.id+'"><div class="ic">'+k.ic+'</div><h3>'+k.n+'</h3><p>'+k.c.length+(k.c.length>1?' courses':' course')+'</p></a>'}).join("")+'</div></div>'}
function courses(){return'<div class="w"><h2>Courses</h2><p class="sub">Choose your level.</p>'+CATS.map(function(k){return'<a class="card" href="#cat-'+k.id+'"><h3>'+k.ic+' '+k.n+'</h3><p>'+k.c.length+' course'+(k.c.length>1?'s':'')+'</p></a>'}).join("")+'</div>'}
function cat(id){var k=CATS.filter(function(x){return x.id===id})[0];if(!k)return courses();
 return'<div class="w"><a class="back" href="#courses">← All levels</a><h2>'+k.ic+' '+k.n+'</h2>'+k.c.map(function(c){return'<a class="card" href="#course-'+c[0]+'"><h3>'+c[1]+'</h3><p>'+c[2]+'</p>'+status(c[0])+'</a>'}).join("")+'</div>'}
function course(id){var f=find(id);if(!f)return courses();var c=f.c,o=OPEN[id];
 var objs=c[3]||(o&&o.obj)||null;
 var b='<div class="w"><a class="back" href="#cat-'+f.cat.id+'">← '+f.cat.n+'</a><h2>'+c[1]+'</h2>'+status(id)+'<p style="margin-top:12px">'+c[2]+'</p>';
 if(objs)b+='<h3>'+(c[3]?'Topics covered':'Objectives')+'</h3><ul class="o">'+objs.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul>';
 if(o&&o.ses)b+='<h3>The 3 sessions</h3>'+o.ses.map(function(s){return'<div class="card"><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>'}).join('');b+='<div class="meta"><div>Format<b>Group or Individual</b></div><div>Delivery<b>Live on Zoom</b></div><div>Duration<b>'+(o?o.dur:"Announced when open")+'</b></div><div>Group size<b>'+(o?o.size.replace("Group: ",""):"Announced when open")+'</b></div></div>';
 b+=o?'<a class="btn w100" href="#enrol-'+id+'">Enrol now</a>':'<button class="btn w100" id="int">'+(mine(id)?'\u2713 Interest recorded':'I am interested in this course')+'</button><p class="note" style="margin-top:10px" id="intn">'+(mine(id)?'Thank you! We will announce here when this course opens.':'No payment now. Tap once to show your interest. We open a course once enough students join, and announce it here.')+'</p>';
 return b+'</div>'}
var st={fmt:"Group course",step:1,n:"",p:"",e:""};
function enrol(id){var f=find(id);if(!f||!OPEN[id])return courses();var c=f.c,o=OPEN[id];
 var pr=st.fmt==="Group course"?o.group:o.solo;
 var b='<div class="w"><a class="back" href="#course-'+id+'">← Course details</a><h2>Enrol: '+c[1]+'</h2><div class="prog"><i class="on"></i><i class="'+(st.step>=2?'on':'')+'"></i><i class="'+(st.step>=3?'on':'')+'"></i></div>';
 if(st.step===1){b+='<div class="card"><label>Format</label><select id="f"><option'+(st.fmt==="Group course"?" selected":"")+'>Group course</option><option'+(st.fmt!=="Group course"?" selected":"")+'>Individual tutoring</option></select><p class="note" style="margin-top:14px">Course fee</p><div class="price">'+pr+'</div><p class="note">Review the price, then decide whether to continue.</p><a class="btn w100" id="c1">Continue</a></div>'}
 else if(st.step===2){b+='<div class="card"><h3>Your details</h3><label>Full name</label><input id="n" value="'+st.n+'" autocomplete="name"><label>Phone / WhatsApp</label><input id="p" type="tel" value="'+st.p+'" autocomplete="tel"><label>Email</label><input id="e" type="email" value="'+st.e+'" autocomplete="email"><br><br><a class="btn w100" id="c2">Get payment instructions</a></div>'}
 else{b+='<div class="card"><h3>Payment instructions</h3><p>Amount: <b>'+pr+'</b> · '+st.fmt+'</p><p>'+BANK+'</p><p class="note">Transfer the amount, then send a screenshot of your receipt on WhatsApp. Your registration is confirmed after approval and you receive your Zoom link.</p><a class="btn w100" target="_blank" href="'+wa("Acuity Academy enrolment\nName: "+st.n+"\nPhone: "+st.p+"\nEmail: "+st.e+"\nCourse: "+c[1]+"\nFormat: "+st.fmt+"\nI have made the payment. Receipt attached.")+'">Send payment proof on WhatsApp</a></div>'}
 return b+'</div>'}
function about(){return'<div class="w"><h2>About Acuity Academy</h2><p>Acuity Academy offers live, interactive surgical teaching on Zoom for medical students, house officers and surgical residents. Teaching is delivered live and adapts to each group. We also offer a short introduction to the OET.</p><div class="card"><h3>Two ways to learn</h3><p>👥 Group course: small live cohorts.<br>🎯 Individual tutoring: one-to-one, at your pace.</p></div><a class="btn w100" target="_blank" href="'+wa("Hello, I have a question about Acuity Academy")+'">Contact on WhatsApp</a></div>'}
var API="https://countapi.mileshilliard.com/api/v1/",ADMIN="ac9x4";
function ikey(id){return"acuity-sd-v2-int-"+id}
function mine(id){try{return localStorage.getItem(ikey(id))==="1"}catch(e){return false}}
function setMine(id){try{localStorage.setItem(ikey(id),"1")}catch(e){}}
function bindInt(id){var b=document.getElementById("int");if(!b)return;if(mine(id)){b.disabled=true;return}
 b.onclick=function(){if(mine(id))return;b.disabled=true;setMine(id);b.textContent="\u2713 Interest recorded";document.getElementById("intn").textContent="Thank you! We will announce here when this course opens.";fetch(API+"hit/"+ikey(id)).catch(function(){})}}
function counts(){var h='<div class="w"><h2>Interest counts</h2><p class="sub">Reload this page to refresh.</p>';
 CATS.forEach(function(k){k.c.forEach(function(c){h+='<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">'+c[1]+'</h3><b id="ct-'+c[0]+'" style="font:800 28px Fraunces,serif;color:var(--ac)">…</b></div>'})});return h+'</div>'}
function loadCounts(){CATS.forEach(function(k){k.c.forEach(function(c){var el=document.getElementById("ct-"+c[0]);
 fetch(API+"get/"+ikey(c[0])).then(function(r){return r.ok?r.json():{value:0}}).then(function(d){el.textContent=d.value||0}).catch(function(){el.textContent="?"})})})}
function route(){var h=(location.hash||"#home").slice(1),k=h.split("-"),v=k[0],a=k.slice(1).join("-"),html;
 if(v==="courses")html=courses();else if(v==="cat")html=cat(a);else if(v==="course")html=course(a);else if(v==="enrol"){if(window._last!==a){st.step=1;window._last=a}html=enrol(a)}else if(v==="about")html=about();else if(v==="counts"&&a===ADMIN)html=counts();else html=home();
 app.innerHTML=html;scrollTo(0,0);
 ["home","courses","about"].forEach(function(x){document.getElementById("n-"+x).className=(v===x||(x==="courses"&&/^(cat|course|enrol)$/.test(v)))?"on":""});
 if(v==="course")bindInt(a);if(v==="counts"&&a===ADMIN)loadCounts();
 if(v==="enrol"){var f=document.getElementById("f"),c1=document.getElementById("c1"),c2=document.getElementById("c2");
  if(f)f.onchange=function(){st.fmt=f.value;route()};
  if(c1)c1.onclick=function(){st.step=2;route()};
  if(c2)c2.onclick=function(){var n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim();if(!n||!p){alert("Please enter your name and phone number.");return}st.n=n;st.p=p;st.e=document.getElementById("e").value;st.step=3;route()}}}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
